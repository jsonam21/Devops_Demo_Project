apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: devops-demo

spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template: 
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
        - name: springboot-app
          image: springboot-devops-app:latest
          imagePullPolicy: Never
          ports:
          - containerPort: 8080

          readinessProbe:
           httpGet:
             path: /health
             port: 8080
           initialDelaySeconds: 10
           periodSeconds: 5

          livenessProbe:
           httpGet:
             path: /health
             port: 8080
           initialDelaySeconds: 30
           periodSeconds: 10



          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"

            limits:
              memory: "512Mi"
              cpu: "500m"


