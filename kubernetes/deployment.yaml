apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: devops-demo

spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template: 
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
        - name: springboot-app
          image: springboot-devops-app:latest
          imagePullPolicy: Never
          ports:
          - containerPort: 8080

          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"

            limits:
              memory: "512Mi"
              cpu: "500m"


