apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: devops-demo

spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template: 
    metadata:
      labels:
        app: springboot-app
      spec:
        containers:
          - name: springboot-app
            image: springboot-devops-app:v1
            imagePullPolicy: Never
            ports:
            - containerPort: 8080

            resources:
              requests:
                memory: "256mi"
                cpu: "200m"

              limits:
                memory: "512mi"
                cpu: "500m"


